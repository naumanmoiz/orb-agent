# Sample orb-agent configuration for network_discovery with NetBox custom fields.
#
# Replace before running:
#   <DIODE_HOST>   your Diode server address
#   LAB-AUS-01     your real tenant / VRF identifier
#   lab-agent-01   a name identifying this agent, used by ${AGENT_NAME}
#
# Secrets come from the environment, never from this file:
#   export DIODE_CLIENT_ID=... DIODE_CLIENT_SECRET=...
#
# Create the custom fields in NetBox first; Diode does not create them:
#   python3 tools/netbox-bootstrap/bootstrap_custom_fields.py \
#     --config agent.example.yaml --dry-run
orb:
  config_manager:
    active: local
  backends:
    common:
      diode:
        target: grpc://<DIODE_HOST>:8080/diode
        client_id: ${DIODE_CLIENT_ID}
        client_secret: ${DIODE_CLIENT_SECRET}
        agent_name: lab-agent-01
        # Uncomment both to write JSON locally instead of ingesting. Remove them
        # (do not set dry_run: false and leave the dir) to go live.
        # dry_run: true
        # dry_run_output_dir: /opt/orb/out
    network_discovery: {}
  policies:
    network_discovery:
      lab_scan:
        config:
          schedule: "0 */4 * * *"
          timeout: 10
          # Existing keys, unchanged.
          defaults:
            # Must name a VRF that already exists in NetBox. The Diode NetBox
            # plugin matches a VRF on name alone, and only while its rd and
            # tenant are both null, so a name that does not exist is created as
            # an empty VRF rather than failing. Verify with the bootstrap script
            # before deploying.
            vrf: LAB-AUS-01
            tenant: LAB-AUS-01
            description: "Discovered by orb network_discovery"
            tags: [orb, network-discovery]
            # NEW: defaults for the prefixes declared in scope.subnet_map.
            prefix:
              status: active
              role: lab-data
          # NEW: applied to every IP address this policy emits. Keys are NetBox
          # custom field names (snake_case, the name and not the label) and the
          # definitions must already exist on ipam.ipaddress.
          custom_fields:
            discovery_agent: "${AGENT_NAME}"
            discovery_policy: "${POLICY_NAME}"
            discovery_last_seen: "${SCAN_TIMESTAMP}"
            discovery_source: network_discovery
          # NEW: how much of ${SCAN_TIMESTAMP} is kept. Default "day".
          #
          # This is a load control, not cosmetics. At "nanosecond" every address
          # carries a value NetBox has never seen, so the reconciler rewrites
          # every address on every scan and NetBox records a changelog entry for
          # each one. At "day" an otherwise unchanged address reconciles to a
          # no-op. Use a finer setting only if you need sub-day last-seen
          # resolution and have measured the write volume.
          #
          # One of: nanosecond, second, minute, hour, day
          timestamp_precision: day
        scope:
          targets:
            - 192.0.2.0/24
          # NEW: the subnets to create as NetBox prefixes. Declared, not
          # discovered: an entry is emitted whether or not anything in it
          # answered the scan, and an entry need not be a scan target.
          #
          # NetBox derives parent/child nesting from containment within the VRF,
          # so no parent is named here. Every entry goes into defaults.vrf, and
          # each discovered address takes the mask of the most specific entry
          # containing it, which is what files it under that prefix.
          subnet_map:
            - prefix: 192.0.2.0/24
              status: container
              role: lab-aggregate
              description: "Lab aggregate"
            - prefix: 192.0.2.0/25
              role: lab-servers
              custom_fields:
                lab_id: "312"
            - prefix: 192.0.2.128/26
              role: lab-gpu
              custom_fields:
                lab_id: "312"
